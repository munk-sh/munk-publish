name: Sync Release to Cloudflare R2 (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync from GitHub Release to R2 (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve release tag & download assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          echo "RELEASE_TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          mkdir -p ./release-assets
          gh release download "$INPUT_TAG" --dir ./release-assets --clobber
          ls -la ./release-assets

      - name: Sync to R2 (release + beta) and prune older than latest 2 versions
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: node scripts/sync-r2-and-prune.mjs --dir=./release-assets --tag="$RELEASE_TAG" --keep=2
